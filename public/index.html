<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f4">
  <title>Bantay Barangay</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17231d;
      background: #f5f7f4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 42rem);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid #dce5dc;
      border-radius: 1.25rem;
      background: #fff;
      box-shadow: 0 1.5rem 4rem rgb(23 35 29 / 8%);
    }

    .eyebrow {
      margin: 0 0 1rem;
      color: #28764a;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 4rem);
      letter-spacing: -0.06em;
      line-height: 1;
    }

    .intro {
      max-width: 34rem;
      margin: 1.5rem 0 2rem;
      color: #526057;
      font-size: 1.1rem;
      line-height: 1.7;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 0;
      padding: 1rem 1.1rem;
      border-radius: 0.75rem;
      background: #f1f5f1;
      color: #526057;
      font-size: 0.95rem;
    }

    .status::before {
      width: 0.65rem;
      height: 0.65rem;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #89968c;
      content: "";
    }

    .status[data-state="online"]::before {
      background: #23834b;
    }

    .status[data-state="offline"]::before {
      background: #b5473c;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Community information and accountability</p>
    <h1>Bantay Barangay</h1>
    <p class="intro">
      A community-based public service accountability and incident monitoring
      system for barangay residents and officials.
    </p>
    <p class="status" id="server-status" role="status" aria-live="polite">
      Checking server connection...
    </p>
  </main>
  <script>
    fetch("/api/ping")
      .then((response) => {
        if (!response.ok) {
          throw new Error(`Server returned ${response.status}`);
        }
        return response.json();
      })
      .then((data) => {
        document.querySelector("#server-status").textContent =
          `Server connected: ${data.message}`;
        document.querySelector("#server-status").dataset.state = "online";
      })
      .catch(() => {
        document.querySelector("#server-status").textContent =
          "The page loaded, but the server health check failed.";
        document.querySelector("#server-status").dataset.state = "offline";
      });
  </script>
</body>
</html>
